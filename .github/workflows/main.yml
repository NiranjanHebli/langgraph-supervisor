name: LangGraph Workflow CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff nbconvert
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with ruff
      run: |
        # Lint any Python files if they exist
        if ls *.py >/dev/null 2>&1; then
          ruff check .
        else
          echo "No .py files found to lint."
        fi

    - name: Check Jupyter Notebook syntax
      run: |
        # Check if the notebook can be converted without errors (basic syntax check)
        jupyter nbconvert --to python langgraph_supervisor.ipynb --stdout > /dev/null
